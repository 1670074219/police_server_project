{% extends "layout.html" %}
{% load static %}

{% block style %}
<style>
  .container-md {
    background-color: rgb(251, 248, 245);
    padding: 20px 20px 20px 20px;
    min-height: calc(100vh - 56px - 56px); /* 只减去导航栏高度 */
    margin-top: 20px;
    border-radius: 20px 20px 20px 20px; /* 修改为顶部圆角 */
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    position: relative;
    padding-bottom: 80px;  /* 增加底部padding */
    width: 100%;
    box-sizing: border-box;
  }
  .input-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    padding: 20px 20px 20px 20px;
    margin: 10px 0 0 0;
    border-radius: 20px;
    border: 1px solid #f6f3f3;
    box-sizing: border-box;
    min-height: 70px;  /* 增加最小高度 */
    line-height: 1.5;  /* 增加行高 */
    font-size: 16px;   /* 调整字体大小 */
  }

  .container-md #microphoneButton {
    position: absolute;
    bottom: 10px;
    right: 10px;
  }
  .content-area {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 10px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    padding: 10px;
    width: 100%;
  }
  img {
    border-radius: 10px;
  }
  .user-message {
    position: relative;
    display: inline-block;
    margin-bottom: 15px;
    padding: 10px 15px;
    border-radius: 10px;
    width: fit-content;
    max-width: 80%;
    background-color: #d1e7ff;
    align-self: flex-end;
    word-wrap: break-word;
  }
  .assistant-message {
    position: relative;
    display: inline-block;
    margin-bottom: 15px;
    padding: 10px 15px;
    border-radius: 10px;
    width: fit-content;
    max-width: 80%;
    background-color: #f0f0f0;
    align-self: flex-start;
    word-wrap: break-word;
  }
  .typing-indicator {
    display: inline-block;
    padding: 10px 15px;
    background-color: #f0f0f0;
    border-radius: 10px;
    margin-bottom: 15px;
    width: fit-content;
    align-self: flex-start;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #888;
    animation: wave 1.3s linear infinite;
  }
  .dot:nth-child(2) {
    animation-delay: -1.1s;
  }
  .dot:nth-child(3) {
    animation-delay: -0.9s;
  }
  @keyframes wave {
    0%, 60%, 100% {
      transform: initial;
    }
    30% {
      transform: translateY(-5px);
    }
  }
  .response-time {
    font-size: 0.8em;
    color: #888;
    margin-top: 5px;
    text-align: right;
  }

  .message-buttons {
    position: absolute;
    top: -20px;
    left: 0;
    display: none;
    margin: 0;
    font-size: 0;
  }
  .user-message:hover .message-buttons,
  .assistant-message:hover .message-buttons {
    display: block;
  }
  .message-buttons button {
    padding: 2px 5px;
    margin: 0;
    font-size: 12px;
    background-color: #fff;
    border: 1px solid #ddd;
    cursor: pointer;
    display: inline-block;
  }
  .message-buttons button:first-child {
    border-radius: 3px 0 0 3px;
    border-right: none;
  }
  .message-buttons button:last-child {
    border-radius: 0 3px 3px 0;
  }
  .message-buttons button:hover {
    background-color: #f8f9fa;
  }
</style>
{% endblock %}

{% block content %}
<!-- 主内容区域 -->
<div class="main-content">
    <div class="container-md">
      <div class="content-area" id="chatMessages">
        <div class="text-center mb-1">
          <img src="{% static 'images/government_service.png' %}" class="img-fluid" style="max-height: 200px;">
        </div>
        <h5 class="text-center mb-4">智能对话助手</h5>
        <!-- 初始欢迎消息 -->
        <div class="assistant-message">
          您好！我是基于RagFlow的智能助手，请问有什么可以帮助您的？
        </div>
      </div>
      
      <textarea class="form-control input-area" id="userInput" placeholder="问我任何问题，按Shift+Enter换行" aria-label="用户输入"></textarea>
      <button class="btn btn-sm btn-light" type="button" id="microphoneButton"><i class="fa-solid fa-microphone"></i></button>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
$(document).ready(function() {
    const chatMessages = $('#chatMessages');
    const userInput = $('#userInput');
    const microphoneButton = $('#microphoneButton');
    const typingIndicator = $('#typingIndicator');
    
    // 自动调整文本框高度
    userInput.on('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });
    
    // 处理Shift+Enter换行
    userInput.on('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    
    // 滚动到底部
    function scrollToBottom() {
      chatMessages.scrollTop(chatMessages[0].scrollHeight);
    }
    
    // 初始滚动到底部
    scrollToBottom();
    
    // 发送消息函数
    async function sendMessage() {
      const message = userInput.val().trim();
      if (!message) return;
      
      // 添加用户消息
      chatMessages.append(`
          <div class="user-message">
              <div class="message-buttons">
                  <button class="copy-btn"><i class="fas fa-copy"></i></button>
                  <button class="speak-btn"><i class="fas fa-volume-up"></i></button>
              </div>
              ${message.replace(/\n/g, '<br>')}
          </div>
      `);

      // 添加助手的消息容器
      const assistantMessageDiv = $(`
          <div class="assistant-message">
              <div class="message-buttons">
                  <button class="copy-btn"><i class="fas fa-copy"></i></button>
                  <button class="speak-btn"><i class="fas fa-volume-up"></i></button>
              </div>
              <div class="message-content"></div>
          </div>
      `);
      chatMessages.append(assistantMessageDiv);
      
      // 清空输入框并滚动到底部
      userInput.val('');
      scrollToBottom();

      try {
          const response = await fetch('{% url "chat_with_model" %}', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
              },
              body: JSON.stringify({ message: message })
          });

          if (!response.ok) {
              throw new Error('网络响应错误');
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          const messageContent = assistantMessageDiv.find('.message-content');
          let buffer = '';
          let audioQueue = [];  // 音频队列
          let isPlaying = false;  // 是否正在播放

          // 播放音频队列的函数
          async function playNextAudio() {
              if (audioQueue.length > 0 && !isPlaying) {
                  isPlaying = true;
                  const audioPath = audioQueue.shift();
                  const audio = new Audio(`/api/get_audio/${audioPath}`);
                  
                  audio.onended = () => {
                      isPlaying = false;
                      playNextAudio();  // 播放下一个
                  };
                  
                  audio.onerror = () => {
                      isPlaying = false;
                      playNextAudio();  // 出错时也继续播放下一个
                  };
                  
                  try {
                      await audio.play();
                  } catch (e) {
                      console.error('播放音频失败:', e);
                      isPlaying = false;
                      playNextAudio();
                  }
              }
          }

          while (true) {
              const { value, done } = await reader.read();
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop() || '';

              for (const line of lines) {
                  if (line.startsWith('data: ')) {
                      const data = line.slice(6);
                      if (data === '[DONE]') {
                          break;
                      }
                      try {
                          const parsed = JSON.parse(data);
                          if (parsed.content) {
                              messageContent.append(parsed.content);
                              scrollToBottom();
                          } else if (parsed.audio_path) {
                              // 将音频文件添加到队列
                              audioQueue.push(parsed.audio_path);
                              // 尝试播放
                              playNextAudio();
                          } else if (parsed.error) {
                              messageContent.append(`<div class="error-message">${parsed.error}</div>`);
                              scrollToBottom();
                          }
                      } catch (e) {
                          console.error('解析数据错误:', e, data);
                      }
                  }
              }
          }

      } catch (error) {
          console.error('发送消息错误:', error);
          assistantMessageDiv.html(`<div class="error-message">发送消息失败: ${error.message}</div>`);
      }
    }

    // 添加录音相关变量
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
      
    // 检查支持的音频格式
    function getSupportedMimeType() {
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        return 'audio/webm;codecs=opus';
      } else if (MediaRecorder.isTypeSupported('audio/webm')) {
        return 'audio/webm';
      }
      return 'audio/webm';  // 默认使用webm格式
    }
      
    // 录音按钮点击事件
    microphoneButton.on('click', async function() {
      if (!isRecording) {
        // 开始录音
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
              audio: {
                  channelCount: 1,
                  sampleRate: 16000,
                  echoCancellation: true,
                  noiseSuppression: true,
                  autoGainControl: true
              }
          });
          mediaRecorder = new MediaRecorder(stream, {
            mimeType: getSupportedMimeType(),
            audioBitsPerSecond: 16000
          });
          audioChunks = [];
          
          mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
          };
          
          mediaRecorder.onstop = async () => {
            try {
              // 使用webm格式发送
              const audioBlob = new Blob(audioChunks, { type: getSupportedMimeType() });
              const formData = new FormData();
              formData.append('audio', audioBlob, 'audio.webm');  // 改为.webm扩展名
              
              // 显示加载提示
              chatMessages.append(`
                <div class="typing-indicator">
                  <span class="dot"></span>
                  <span class="dot"></span>
                  <span class="dot"></span>
                </div>
              `);
              
              const response = await fetch('{% url "process_voice" %}', {
                method: 'POST',
                body: formData
              });
              
              // 移除加载提示
              $('.typing-indicator').remove();
              
              if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || '语音识别失败');
              }
              
              const data = await response.json();
              if (data.text) {
                userInput.val(data.text);
                sendMessage();
              } else {
                throw new Error('未获取到识别结果');
              }
            } catch (error) {
              console.error('语音处理错误:', error);
              alert(error.message || '语音识别失败，请重试');
            } finally {
              // 重置录音状态
              audioChunks = [];
            }
          };
          
          mediaRecorder.start(1000);
          isRecording = true;
          microphoneButton.removeClass('btn-light').addClass('btn-danger');
          
        } catch (error) {
          console.error('录音权限错误:', error);
          alert('无法访问麦克风，请确保已授予录音权限');
        }
      } else {
        // 停止录音
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
        microphoneButton.removeClass('btn-danger').addClass('btn-light');
      }
    });

    // 添加语音播放功能
    $(document).on('click', '.speak-btn', async function() {
      const messageDiv = $(this).closest('.user-message, .assistant-message');
      let text;
      
      // 检查是否存在 .message-content
      const messageContent = messageDiv.find('.message-content');
      if (messageContent.length > 0) {
          // 如果存在 .message-content，获取其文本内容（助手消息）
          text = messageContent.text().trim();
      } else {
          // 否则获取整个消息 div 的文本内容（用户消息）
          text = messageDiv.clone().children().remove().end().text().trim();
      }
      
      if (!text) {
          alert('没有找到可播放的文本内容');
          return;
      }
      try {
          // 显示加载状态
          const speakBtn = $(this);
          speakBtn.prop('disabled', true);
          speakBtn.html('<i class="fas fa-spinner fa-spin"></i>');
          
          const response = await fetch('{% url "text_to_speech" %}', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
              },
              body: JSON.stringify({ text: text })
          });
          
          if (!response.ok) {
              throw new Error('语音合成失败');
          }
          
          // 获取音频数据并播放
          const audioBlob = await response.blob();
          const audioUrl = URL.createObjectURL(audioBlob);
          const audio = new Audio(audioUrl);
          
          audio.onended = function() {
              URL.revokeObjectURL(audioUrl);
              speakBtn.prop('disabled', false);
              speakBtn.html('<i class="fas fa-volume-up"></i>');
          };
          
          audio.onerror = function() {
              URL.revokeObjectURL(audioUrl);
              speakBtn.prop('disabled', false);
              speakBtn.html('<i class="fas fa-volume-up"></i>');
              alert('音频播放失败');
          };
          
          await audio.play();
          
      } catch (error) {
          console.error('语音播放错误:', error);
          alert('语音播放失败，请重试');
          $(this).prop('disabled', false).html('<i class="fas fa-volume-up"></i>');
      }
    });
    // 添加复制功能
    $(document).on('click', '.copy-btn', function() {
        const copyBtn = $(this);
        const messageDiv = copyBtn.closest('.user-message, .assistant-message');
        let text;
        
        // 检查是否存在 .message-content
        const messageContent = messageDiv.find('.message-content');
        if (messageContent.length > 0) {
            // 如果存在 .message-content，获取其文本内容
            text = messageContent.text().trim();
        } else {
            // 否则获取整个消息 div 的文本内容（用于用户消息）
            text = messageDiv.clone().children().remove().end().text().trim();
        }
        
        navigator.clipboard.writeText(text).then(() => {
            copyBtn.html('<i class="fas fa-check"></i>');
            setTimeout(() => {
                copyBtn.html('<i class="fas fa-copy"></i>');
            }, 1000);
        }).catch(function(err) {
            console.error('复制失败:', err);
            alert('复制失败，请重试');
        });
      });
  });
</script>
{% endblock %}
