{% extends "layout.html" %}
{% load static %}

{% block style %}
<style>
  .container-md {
    background-color: rgb(251, 248, 245);
    padding: 20px 20px 20px 20px;
    min-height: calc(100vh - 56px - 56px); /* 只减去导航栏高度 */
    margin-top: 20px;
    border-radius: 20px 20px 20px 20px; /* 修改为顶部圆角 */
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
    position: relative;
    padding-bottom: 80px;  /* 增加底部padding */
    width: 100%;
    box-sizing: border-box;
  }
  .input-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    padding: 20px 20px 20px 20px;
    margin: 10px 0 0 0;
    border-radius: 20px;
    border: 1px solid #f6f3f3;
    box-sizing: border-box;
    min-height: 70px;  /* 增加最小高度 */
    line-height: 1.5;  /* 增加行高 */
    font-size: 16px;   /* 调整字体大小 */
  }

  .container-md #sendButton {
    position: absolute;
    bottom: 10px;
    right: 10px;
  }
  .content-area {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin-bottom: 10px;
    max-height: calc(100vh - 200px);
    overflow-y: auto;
    padding: 10px;
    width: 100%;
  }
  img {
    border-radius: 10px;
  }
  .user-message {
    display: inline-block;
    margin-bottom: 15px;
    padding: 10px 15px;
    border-radius: 10px;
    width: fit-content;
    max-width: 80%;
    background-color: #d1e7ff;
    align-self: flex-end;
    word-wrap: break-word;
  }
  .assistant-message {
    display: inline-block;
    margin-bottom: 15px;
    padding: 10px 15px;
    border-radius: 10px;
    width: fit-content;
    max-width: 80%;
    background-color: #f0f0f0;
    align-self: flex-start;
    word-wrap: break-word;
  }
  .typing-indicator {
    display: inline-block;
    padding: 10px 15px;
    background-color: #f0f0f0;
    border-radius: 10px;
    margin-bottom: 15px;
    width: fit-content;
    align-self: flex-start;
  }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: #888;
    animation: wave 1.3s linear infinite;
  }
  .dot:nth-child(2) {
    animation-delay: -1.1s;
  }
  .dot:nth-child(3) {
    animation-delay: -0.9s;
  }
  @keyframes wave {
    0%, 60%, 100% {
      transform: initial;
    }
    30% {
      transform: translateY(-5px);
    }
  }
  .response-time {
    font-size: 0.8em;
    color: #888;
    margin-top: 5px;
    text-align: right;
  }
</style>
{% endblock %}

{% block content %}
<!-- 主内容区域 -->
<div class="main-content">
    <div class="container-md">
      <div class="content-area" id="chatMessages">
        <div class="text-center mb-1">
          <img src="{% static 'images/government_service.png' %}" class="img-fluid" style="max-height: 200px;">
        </div>
        <h5 class="text-center mb-4">智能对话助手</h5>
        <!-- 初始欢迎消息 -->
        <div class="assistant-message">
          您好！我是基于RagFlow的智能助手，请问有什么可以帮助您的？
        </div>
      </div>
      
      <textarea class="form-control input-area" id="userInput" placeholder="问我任何问题，按Shift+Enter换行" aria-label="用户输入"></textarea>
      <button class="btn btn-sm btn-primary" type="button" id="sendButton"><i class="fa-solid fa-microphone"></i></button>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
$(document).ready(function() {
    const chatMessages = $('#chatMessages');
    const userInput = $('#userInput');
    const sendButton = $('#sendButton');
    const typingIndicator = $('#typingIndicator');
    
    // 自动调整文本框高度
    userInput.on('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });
    
    // 处理Shift+Enter换行
    userInput.on('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    
    // 发送按钮点击事件
    sendButton.on('click', sendMessage);
    
    // 滚动到底部
    function scrollToBottom() {
      chatMessages.scrollTop(chatMessages[0].scrollHeight);
    }
    
    // 初始滚动到底部
    scrollToBottom();
    
    // 发送消息函数
    function sendMessage() {
      const message = userInput.val().trim();
      if (!message) return;
      
      // 添加用户消息到聊天区域
      chatMessages.append(`
        <div class="user-message">
          ${message.replace(/\n/g, '<br>')}
        </div>
      `);
      
      // 清空输入框并重置高度
      userInput.val('');
      userInput.css('height', 'auto');
      
      // 移除旧的打字指示器（如果存在）
      $('.typing-indicator').remove();
      
      // 添加新的打字指示器到最新消息后
      chatMessages.append(`
        <div class="typing-indicator">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      `);
      
      scrollToBottom();
      
      // 禁用输入和发送按钮
      userInput.prop('disabled', true);
      sendButton.prop('disabled', true);
      
      // 发送请求到后端
      console.log("准备发送请求:", message);
      $.ajax({
        url: '{% url "chat_with_model" %}',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ message: message }),
        timeout: 180000,
        success: function(data) {
          // 移除打字指示器
          $('.typing-indicator').remove();
          
          // 添加助手回复
          let responseHtml = `
            <div class="message assistant-message">
              ${data.response.replace(/\n/g, '<br>')}`;
              
          // 如果有响应时间，显示它
          if (data.elapsed_time) {
            responseHtml += `
              <div class="response-time">
                响应时间: ${data.elapsed_time}秒
              </div>`;
          }
          
          responseHtml += `</div>`;
          chatMessages.append(responseHtml);
          
          // 启用输入和发送按钮
          userInput.prop('disabled', false);
          sendButton.prop('disabled', false);
          userInput.focus();
          
          scrollToBottom();
        },
        error: function(xhr, status, error) {
          console.error("AJAX错误详情:", {
            status: status,
            error: error,
            responseText: xhr.responseText
          });
          // 移除打字指示器
          $('.typing-indicator').remove();
          
          // 显示错误消息
          let errorMessage = "发生未知错误";
          
          if (status === 'timeout') {
            errorMessage = "请求超时，模型响应时间过长。请尝试更简短的问题或稍后再试。";
          } else {
            try {
              const response = JSON.parse(xhr.responseText);
              if (response && response.message) {
                errorMessage = response.message;
              }
            } catch (e) {
              errorMessage = `请求失败: ${error || status}`;
            }
          }
          
          chatMessages.append(`
            <div class="message assistant-message" style="background-color: #ffdddd;">
              <strong>错误:</strong> ${errorMessage}
            </div>
          `);
          
          // 启用输入和发送按钮
          userInput.prop('disabled', false);
          sendButton.prop('disabled', false);
          
          scrollToBottom();
        }
      });
    }
  });
</script>
{% endblock %}
