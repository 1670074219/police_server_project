{% extends "layout.html" %}
{% load static %}

{% block style %}
<style>
    .container-md {
      background-color: #f8f9fa;
      padding: 20px 20px 20px 20px;
      min-height: calc(100vh - 56px - 56px); /* 只减去导航栏高度 */
      margin-top: 20px;
      margin-bottom: 20px;
      border-radius: 20px; /* 四周圆角 */
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
      padding-bottom: 80px;  /* 增加底部padding */
      width: 100%; /* 占满父容器宽度 */
      max-width: 1000px; /* 限制最大宽度，提升阅读体验 */
      box-sizing: border-box;
    }
    .input-area {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      padding: 20px 20px 20px 20px;
      margin: 10px 0 0 0;
      border-radius: 20px;
      border: 1px solid #f6f3f3;
      box-sizing: border-box;
      min-height: 70px;  /* 增加最小高度 */
      line-height: 1.5;  /* 增加行高 */
      font-size: 16px;   /* 调整字体大小 */
    }

    .container-md #microphoneButton {
      position: absolute;
      bottom: 10px;
      right: 10px;
    }

    .sidebar #uploadDocuments {
      position: absolute;
      bottom: 20px;
      left: 10%;
      width: 80%; /* 宽度占底部80% */
      text-align: center; /* 文本居中 */
      padding: 8px 0;
      border-radius: 5px;
      background-color: #f0f0f0;
      border: 1px solid #ddd;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .container-md #newChat {
      position: absolute;
      bottom: 100px;
      right: 1%;
      width: 10%; /* 宽度占底部80% */
      text-align: center; /* 文本居中 */
      padding: 8px 0;
      border-radius: 20px;
      /* background-color: #f0f0f0; */
      border: 1px solid #ddd;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }


    .sidebar #documentManagement {
      position: absolute;
      bottom: 20px;
      left: 10%;
      width: 80%; /* 宽度占底部80% */
      text-align: center; /* 文本居中 */
      padding: 8px 0;
      border-radius: 5px;
      background-color: #f0f0f0;
      border: 1px solid #ddd;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .sidebar #uploadDocuments i {
      margin-right: 5px;
    }

    .sidebar #uploadDocuments:hover {
      background-color: #e0e0e0;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .content-area {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 10px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
      padding: 10px;
      width: 100%;
    }
    img {
      border-radius: 10px;
    }
    .user-message {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
      padding: 10px 15px;
      border-radius: 10px;
      width: fit-content;
      max-width: 80%;
      background-color: #d1e7ff;
      align-self: flex-end;
      word-wrap: break-word;
    }
    .assistant-message {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
      padding: 10px 15px;
      border-radius: 10px;
      width: fit-content;
      max-width: 80%;
      background-color: #f0f0f0;
      align-self: flex-start;
      word-wrap: break-word;
    }
    .typing-indicator {
      display: inline-block;
      padding: 10px 15px;
      background-color: #f0f0f0;
      border-radius: 10px;
      margin-bottom: 15px;
      width: fit-content;
      align-self: flex-start;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #888;
      animation: wave 1.3s linear infinite;
    }
    .dot:nth-child(2) {
      animation-delay: -1.1s;
    }
    .dot:nth-child(3) {
      animation-delay: -0.9s;
    }
    @keyframes wave {
      0%, 60%, 100% {
        transform: initial;
      }
      30% {
        transform: translateY(-5px);
      }
    }
    .response-time {
      font-size: 0.8em;
      color: #888;
      margin-top: 5px;
      text-align: right;
    }
    
    /* 侧边栏样式 */
    .sidebar {
      position: fixed;
      top: 77px; /* 导航栏高度 */
      left: 0;
      height: calc(100vh - 77px - 27px);
      width: 220px; /* 增加宽度 */
      background-color: #f8f9fa;
      padding-top: 20px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      z-index: 100;
      transition: all 0.3s;
      border-radius: 0 20px 20px 0;
    }
    
    .sidebar-header {
      padding: 15px;
      border-bottom: 1px solid #dee2e6;
    }
    
    .sidebar-header .form-select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #dee2e6;
      background-color: white;
      font-size: 14px;
    }
    
    .sidebar-header .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
    }
    
    .sidebar-menu {
      list-style: none;
      padding: 0;
      margin: 0;
      padding-top: 10px;
    }
    
    .sidebar-menu li {
      padding: 10px 15px;
      border-bottom: 1px solid #eee;
    }
    
    .sidebar-menu li a {
      color: #333;
      text-decoration: none;
      display: block;
    }
    
    .sidebar-menu li:hover {
      background-color: #e9ecef;
    }
    
    .sidebar-menu li.active {
      background-color: #e9ecef;
      border-left: 4px solid #0d6efd;
    }
    
    .sidebar-menu li.active a {
      color: #0d6efd;
    }
    
    /* 主内容区域调整 */
    .main-content {
      margin-left: 220px; /* 与侧边栏宽度一致 */
      transition: all 0.3s;
      width: calc(100% - 220px); /* 减去侧边栏宽度 */
      padding: 0 20px; /* 左右内边距 */
      display: flex;
      justify-content: center; /* 水平居中 */
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
      .sidebar {
        margin-left: -220px; /* 与侧边栏宽度一致 */
      }
      
      .sidebar.active {
        margin-left: 0;
      }
      
      .main-content {
        margin-left: 0;
        width: 100%;
        padding: 0 10px;
      }
      
      .main-content.active {
        margin-left: 220px; /* 与侧边栏宽度一致 */
        width: calc(100% - 220px);
      }
    }

    .message-buttons {
      position: absolute;
      top: -20px;
      left: 0;
      display: none;
      margin: 0;
      font-size: 0;
    }
    .user-message:hover .message-buttons,
    .assistant-message:hover .message-buttons {
      display: block;
    }
    .message-buttons button {
      padding: 2px 5px;
      margin: 0;
      font-size: 12px;
      background-color: #fff;
      border: 1px solid #ddd;
      cursor: pointer;
      display: inline-block;
    }
    .message-buttons button:first-child {
      border-radius: 3px 0 0 3px;
      border-right: none;
    }
    .message-buttons button:last-child {
      border-radius: 0 3px 3px 0;
    }
    .message-buttons button:hover {
      background-color: #f8f9fa;
    }

    /* 添加系统消息样式 */
    .system-message {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
      padding: 10px 15px;
      border-radius: 10px;
      width: fit-content;
      max-width: 80%;
      background-color: #f5f5f5;
      align-self: center;
      word-wrap: break-word;
      text-align: center;
      font-size: 0.9em;
      color: #666;
    }
    
    .system-message.success {
      background-color: #e6f7e6;
      color: #2c7a2c;
      border: 1px solid #c8e6c8;
    }
    
    .system-message.error {
      background-color: #fde7e7;
      color: #d32f2f;
      border: 1px solid #f5c8c8;
    }
    
    .system-message i {
      margin-right: 5px;
    }
    
    /* 允许文件多选 */
    #fileUpload {
      display: none;
    }
    
    /* 思考内容样式 - 类似Markdown引用 */
    .think-content {
      background-color: #f5f7f9;
      border-left: 4px solid #b3c1cd;
      padding: 10px;
      margin: 5px 0;
      color: #666;
      line-height: 1.5;
    }
</style>
{% endblock %}

{% block content %}
  <!-- 侧边栏 -->
  <div class="sidebar">
    <div class="sidebar-header">
      <select class="form-select" id="modelSelect">
        <option selected>选择助手</option>
        <option value="xiaozhi">小智</option>
        <option value="xiaomei">小美</option>
        <option value="xiaoqiang">小强</option>
        <option value="xiaoming">小明</option>
        <option value="xiaoli">小李</option>
      </select>
    </div>
    <ul class="sidebar-menu" id="chatHistory">
      <!-- 聊天历史记录将在这里动态添加 -->
    </ul>
    <!-- <button class="btn btn-sm" type="button" id="uploadDocuments">
      <i class="fa-solid fa-file-arrow-up"></i> 上传文档
    </button> -->
    <button class="btn btn-sm mt-2" type="button" id="documentManagement">

  <!-- 主内容区域 -->
  <div class="main-content">
    <div class="container-md">

        </div>
        <h5 class="text-center mb-4">智能对话助手</h5>
        <!-- 初始欢迎消息 -->

{% endblock %}

{% block script %}
<script>
    $(document).ready(function() {
        // 添加一个控制台警告，提醒用户需要重启服务器和刷新页面
        console.warn("%c重要提示", "font-size:20px; color:red; font-weight:bold;");
        console.warn("%c为了使<think>标签样式生效，请确保:", "font-size:14px; color:orange;");
        console.warn("%c1. 重启服务器", "font-size:14px;");
        console.warn("%c2. 清除浏览器缓存并强制刷新页面 (Ctrl+F5 或 Cmd+Shift+R)", "font-size:14px;");
        
        const chatMessages = $('#chatMessages');
        const userInput = $('#userInput');
        const modelSelect = $('#modelSelect');
        const microphoneButton = $('#microphoneButton');
        const uploadDocumentsButton = $('#uploadDocuments');
        const documentManagementButton = $('#documentManagement');
        const newChatButton = $('#newChat');

        // 添加隐藏的文件上传输入框
        $('body').append('<input type="file" id="fileUpload" style="display: none;" accept=".pdf,.doc,.docx,.txt" multiple>');
        const fileUpload = $('#fileUpload');

        // 处理文件上传按钮点击
        uploadDocumentsButton.on('click', function() {
            fileUpload.click();
        });

        // 处理文件选择
        fileUpload.on('change', function(e) {
            const files = e.target.files;
            if (files.length > 0) {
                uploadFiles(files);
            }
        });

        // 上传文件函数
        function uploadFiles(files) {
            // 创建FormData对象
            const formData = new FormData();
            
            // 添加选择的文件
            for (let i = 0; i < files.length; i++) {
                formData.append('documents', files[i]);
            }
            
            // 显示上传中提示
            chatMessages.append(`
                <div class="system-message">
                    <i class="fas fa-spinner fa-spin"></i> 正在上传文档，请稍候...
                </div>
            `);
            scrollToBottom();
            
            // 发送上传请求 - 注意：需要在后端实现此接口
            // TODO: 将URL替换为实际的上传端点
            $.ajax({
                url: '/upload_documents',  // 替换为实际的上传URL
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function(response) {
                    // 移除上传中提示
                    $('.system-message').remove();
                    
                    // 显示上传成功消息
                    chatMessages.append(`
                        <div class="system-message success">
                            <i class="fas fa-check-circle"></i> 文档上传成功！
                        </div>
                    `);
                    scrollToBottom();
                    
                    // 清空文件输入框，允许重复上传同一文件
                    fileUpload.val('');
                },
                error: function(xhr, status, error) {
                    // 移除上传中提示
                    $('.system-message').remove();
                    
                    // 显示错误消息
                    chatMessages.append(`
                        <div class="system-message error">
                            <i class="fas fa-exclamation-circle"></i> 文档上传失败: ${xhr.responseJSON?.error || error}
                        </div>
                    `);
                    scrollToBottom();
                    
                    // 清空文件输入框
                    fileUpload.val('');
                }
            });
        }
        
        // 创建音频上下文 - 提前创建以允许用户交互激活
        let audioContext;
        try {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          console.log("[DEBUG] 音频上下文初始创建成功，状态:", audioContext.state);
        } catch (error) {
          console.error("[ERROR] 创建音频上下文失败:", error);
          alert("创建音频上下文失败: " + error.message);
        }
        
        // 自动调整文本框高度
        userInput.on('input', function() {
          this.style.height = 'auto';
          this.style.height = (this.scrollHeight) + 'px';
        });
        
        // 处理Shift+Enter换行
        userInput.on('keydown', function(e) {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
          
        // 滚动到底部
        function scrollToBottom() {
          chatMessages.scrollTop(chatMessages[0].scrollHeight);
        }
        
        // 初始滚动到底部
        scrollToBottom();
        
        // 发送消息函数
        async function sendMessage() {
            const message = userInput.val().trim();
            if (!message) return;

            // 添加用户消息
            chatMessages.append(`
                <div class="user-message">
                    <div class="message-buttons">
                        <button class="copy-btn"><i class="fas fa-copy"></i></button>
                        <button class="speak-btn"><i class="fas fa-volume-up"></i></button>
                    </div>
                    ${message.replace(/\n/g, '<br>')}
                </div>
            `);

            // 添加助手的消息容器
            const assistantMessageDiv = $(`
                <div class="assistant-message">
                    <div class="message-buttons">
                        <button class="copy-btn"><i class="fas fa-copy"></i></button>
                        <button class="speak-btn"><i class="fas fa-volume-up"></i></button>
                    </div>
                    <div class="message-content"></div>
                </div>
            `);
            chatMessages.append(assistantMessageDiv);
            
            // 清空输入框并滚动到底部
            userInput.val('');
            scrollToBottom();

            try {
                const response = await fetch('{% url "chat_with_model" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    console.error("[ERROR] 网络响应错误:", response.status, response.statusText);
                    throw new Error('网络响应错误: ' + response.status);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                const messageContent = assistantMessageDiv.find('.message-content');
                let buffer = '';
                
                // Web Audio API 相关变量
                console.log("[DEBUG] 初始化Web Audio API...");
                
                // 尝试激活音频上下文
                if (audioContext && audioContext.state === 'suspended') {
                    try {
                        await audioContext.resume();
                        console.log("[DEBUG] 音频上下文已成功恢复");
                    } catch (error) {
                        console.error("[ERROR] 恢复音频上下文失败:", error);
                        alert("请点击页面以允许音频播放");
                    }
                }
                
                let audioQueue = [];  // 音频队列
                let isPlaying = false;  // 是否正在播放

                // 播放音频队列的函数 - 使用Web Audio API
                async function playNextAudio() {
                    console.log("[DEBUG] 播放下一个音频被调用, 队列长度:", audioQueue.length, "是否正在播放:", isPlaying);
                    console.log("[DEBUG] 音频上下文状态:", audioContext.state);
                    
                    if (audioQueue.length > 0 && !isPlaying) {
                        isPlaying = true;
                        
                        // 从队列中取出音频数据
                        const audioData = audioQueue.shift();
                        console.log("[DEBUG] 处理音频数据, chunk_id:", audioData.chunk_id);
                        
                        try {
                            console.log("[DEBUG] 解码base64音频数据...");
                            // 解码音频数据 - 使用更安全的方法
                            let audioArrayBuffer;
                            try {
                                const binaryString = atob(audioData.audio_data);
                                const bytes = new Uint8Array(binaryString.length);
                                for (let i = 0; i < binaryString.length; i++) {
                                    bytes[i] = binaryString.charCodeAt(i);
                                }
                                audioArrayBuffer = bytes.buffer;
                                console.log("[DEBUG] Base64解码成功，音频数据长度:", audioArrayBuffer.byteLength, "字节");
                            } catch (e) {
                                console.error("[ERROR] Base64解码失败:", e);
                                isPlaying = false;
                                setTimeout(playNextAudio, 10); // 尝试下一个
                                return;
                            }
                            
                            // 将PCM数据转换为AudioBuffer
                            console.log("[DEBUG] 开始解码PCM数据，采样率:", audioData.sample_rate);
                            
                            try {
                                // 创建新的Float32Array来存储PCM数据
                                const pcmData = new Float32Array(audioArrayBuffer.byteLength / 2);
                                const dataView = new DataView(audioArrayBuffer);
                                
                                // 从Int16转换为Float32
                                for (let i = 0; i < pcmData.length; i++) {
                                    pcmData[i] = dataView.getInt16(i * 2, true) / 32768.0;
                                }
                                
                                console.log("[DEBUG] PCM数据准备完成，长度:", pcmData.length);
                                
                                // 创建新的AudioBuffer
                                const audioBuffer = audioContext.createBuffer(1, pcmData.length, audioData.sample_rate);
                                audioBuffer.getChannelData(0).set(pcmData);
                                
                                console.log("[DEBUG] AudioBuffer创建成功");
                                
                                // 创建音频源并连接到输出
                                console.log("[DEBUG] 创建音频源...");
                                const source = audioContext.createBufferSource();
                                source.buffer = audioBuffer;
                                
                                // 添加增益节点，可以控制音量
                                const gainNode = audioContext.createGain();
                                gainNode.gain.value = 1.0; // 音量设置为1.0，可以根据需要调整
                                
                                // 连接节点: 音源 -> 增益 -> 目标(扬声器)
                                source.connect(gainNode);
                                gainNode.connect(audioContext.destination);
                                
                                // 播放结束后处理下一个
                                source.onended = () => {
                                    console.log("[DEBUG] 音频播放结束");
                                    isPlaying = false;
                                    playNextAudio();
                                };
                                
                                // 开始播放
                                console.log("[DEBUG] 开始播放音频...");
                                source.start(0);
                                console.log("[DEBUG] 播放命令已发送");
                            } catch (e) {
                                console.error("[ERROR] AudioBuffer处理失败:", e);
                                isPlaying = false;
                                setTimeout(() => {
                                    playNextAudio();
                                }, 100);
                            }
                        } catch (e) {
                            console.error("[ERROR] 播放音频失败:", e);
                            isPlaying = false;
                            // 延迟一点时间再尝试下一个，避免连续失败造成死循环
                            setTimeout(() => {
                                playNextAudio();
                            }, 100);
                        }
                    } else {
                        console.log("[DEBUG] 不满足播放条件或没有音频可播放");
                    }
                }

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) {break;}

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    console.log("[DEBUG] 处理", lines.length, "行数据");
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                console.log("[DEBUG] 收到结束标记 [DONE]");
                                break;
                            }
                            try {
                                const parsed = JSON.parse(data);
                                console.log("[DEBUG] 解析的数据类型:", Object.keys(parsed));
                                
                                if (parsed.content) {
                                    const char = parsed.content;
                                    console.log("[CHAR DEBUG]", JSON.stringify(char));
                                    
                                    // 直接添加单个字符
                                    messageContent.append(char);
                                    
                                    // 每10个字符输出一次当前HTML内容，用于调试
                                    if (Math.random() < 0.1) {  // 大约10%的概率记录
                                        console.log("[HTML DEBUG] 当前消息HTML:", messageContent.html());
                                    }
                                    
                                    // 检查是否完成了一个</think>标签
                                    const contentHtml = messageContent.html();
                                    if (contentHtml.includes('&lt;think&gt;') && contentHtml.includes('&lt;/think&gt;')) {
                                        console.log("[DEBUG] 检测到HTML转义的think标签");
                                        
                                        // 处理HTML转义的标签
                                        try {
                                            const newHtml = contentHtml.replace(/&lt;think&gt;([\s\S]*?)&lt;\/think&gt;/g, function(match, content) {
                                                console.log("[DEBUG] 匹配到转义的think内容:", content);
                                                return '<div class="think-content">' + content + '</div>';
                                            });
                                            console.log("[DEBUG] 替换后的HTML:", newHtml);
                                            messageContent.html(newHtml);
                                        } catch (error) {
                                            console.error("[ERROR] 替换转义think标签时出错:", error);
                                        }
                                    }
                                    else if (contentHtml.includes('<think>') && contentHtml.includes('</think>')) {
                                        console.log("[DEBUG] 检测到非转义的think标签");
                                        
                                        // 使用正则表达式一次性替换所有已完成的<think>内容
                                        try {
                                            const newHtml = contentHtml.replace(/<think>([\s\S]*?)<\/think>/g, function(match, content) {
                                                console.log("[DEBUG] 匹配到think内容:", content);
                                                return '<div class="think-content">' + content + '</div>';
                                            });
                                            console.log("[DEBUG] 替换后的HTML:", newHtml);
                                            messageContent.html(newHtml);
                                        } catch (error) {
                                            console.error("[ERROR] 替换think标签时出错:", error);
                                        }

                                    }
                                    
                                    scrollToBottom();
                                } else if (parsed.audio_data) {
                                    // 收到音频数据，添加到队列
                                    console.log("[DEBUG] 收到音频数据 chunk_id:", parsed.chunk_id, "数据长度:", parsed.audio_data.length);
                                    
                                    // 如果是第一个音频块，尝试开始播放
                                    const shouldStartPlaying = audioQueue.length === 0 && !isPlaying;
                                    
                                    // 添加到队列
                                    audioQueue.push(parsed);
                                    
                                    // 如果之前没有播放，立即开始播放
                                    if (shouldStartPlaying) {
                                        console.log("[DEBUG] 调用playNextAudio开始播放");
                                        playNextAudio();
                                    }
                                } else if (parsed.error) {
                                    console.error("[ERROR] 收到错误:", parsed.error);
                                    messageContent.append(`<div class="error-message">${parsed.error}</div>`);
                                    scrollToBottom();
                                }
                            } catch (e) {
                                console.error('[ERROR] 解析数据错误:', e, "数据:", data);
                            }
                        }
                    }
                }

            } catch (error) {
                console.error('[ERROR] 发送消息错误:', error);
                assistantMessageDiv.html(`<div class="error-message">发送消息失败: ${error.message}</div>`);

        }
        
        // 侧边栏切换功能

          switch(selectedModel) {

              welcomeMessage += "我是小智，擅长初中物理";
              ragflow_chat_id = "2150c87c0fca11f0bcd96a8b746c55e2";

              break;
            case "xiaomei":
              welcomeMessage += "我是小美，我会加入自己的总结。";
              ragflow_chat_id = "6f2813840d6d11f0a4349e333fa9eae3";

              ragflow_chat_id = "6f2813840d6d11f0a4349e333fa9eae3";

            case "xiaoming":
              welcomeMessage += "我是小明，擅长数据分析和逻辑推理。";
              ragflow_chat_id = "6f2813840d6d11f0a4349e333fa9eae3";

        // 添加录音相关变量
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        
        // 检查支持的音频格式
        function getSupportedMimeType() {
          if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
            return 'audio/webm;codecs=opus';
          } else if (MediaRecorder.isTypeSupported('audio/webm')) {
            return 'audio/webm';
          }
          return 'audio/webm';  // 默认使用webm格式
        }
        
        // 录音按钮点击事件
        microphoneButton.on('click', async function() {
          if (!isRecording) {
            // 开始录音
            try {
              const stream = await navigator.mediaDevices.getUserMedia({
                  audio: {
                      channelCount: 1,
                      sampleRate: 16000,
                      echoCancellation: true,
                      noiseSuppression: true,
                      autoGainControl: true
                  }
              });
              mediaRecorder = new MediaRecorder(stream, {
                mimeType: getSupportedMimeType(),
                audioBitsPerSecond: 16000
              });
              audioChunks = [];
              
              mediaRecorder.ondataavailable = (event) => {
                audioChunks.push(event.data);
              };
              
              mediaRecorder.onstop = async () => {
                try {
                  // 使用webm格式发送
                  const audioBlob = new Blob(audioChunks, { type: getSupportedMimeType() });
                  const formData = new FormData();
                  formData.append('audio', audioBlob, 'audio.webm');  // 改为.webm扩展名
                  
                  // 显示加载提示
                  chatMessages.append(`
                    <div class="typing-indicator">
                      <span class="dot"></span>
                      <span class="dot"></span>
                      <span class="dot"></span>
                    </div>
                  `);
                  
                  const response = await fetch('{% url "process_voice" %}', {
                    method: 'POST',
                    body: formData
                  });
                  
                  // 移除加载提示
                  $('.typing-indicator').remove();
                  
                  if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || '语音识别失败');
                  }
                  
                  const data = await response.json();
                  if (data.text) {
                    userInput.val(data.text);
                    sendMessage();
                  } else {
                    throw new Error('未获取到识别结果');
                  }
                } catch (error) {
                  console.error('语音处理错误:', error);
                  alert(error.message || '语音识别失败，请重试');
                } finally {
                  // 重置录音状态
                  audioChunks = [];
                }
              };
              
              mediaRecorder.start(1000);
              isRecording = true;
              microphoneButton.removeClass('btn-light').addClass('btn-danger');
              
            } catch (error) {
              console.error('录音权限错误:', error);
              alert('无法访问麦克风，请确保已授予录音权限');
            }
          } else {
            // 停止录音
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            isRecording = false;
            microphoneButton.removeClass('btn-danger').addClass('btn-light');
          }
        });

        // 添加语音播放功能
        $(document).on('click', '.speak-btn', async function() {
          const messageDiv = $(this).closest('.user-message, .assistant-message');
          let text;
          
          // 检查是否存在 .message-content
          const messageContent = messageDiv.find('.message-content');
          if (messageContent.length > 0) {
              // 如果存在 .message-content，获取其文本内容（助手消息）
              text = messageContent.text().trim();
          } else {
              // 否则获取整个消息 div 的文本内容（用户消息）
              text = messageDiv.clone().children().remove().end().text().trim();
          }
          
          if (!text) {
              alert('没有找到可播放的文本内容');
              return;
          }
          
          try {
              // 显示加载状态
              const speakBtn = $(this);
              speakBtn.prop('disabled', true);
              speakBtn.html('<i class="fas fa-spinner fa-spin"></i>');
              
              const response = await fetch('{% url "text_to_speech" %}', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json',
                  },
                  body: JSON.stringify({ text: text })
              });
              
              if (!response.ok) {
                  throw new Error('语音合成失败');
              }
              
              // 获取音频数据并播放
              const audioBlob = await response.blob();
              const audioUrl = URL.createObjectURL(audioBlob);
              const audio = new Audio(audioUrl);
              
              audio.onended = function() {
                  URL.revokeObjectURL(audioUrl);
                  speakBtn.prop('disabled', false);
                  speakBtn.html('<i class="fas fa-volume-up"></i>');
              };
              
              audio.onerror = function() {
                  URL.revokeObjectURL(audioUrl);
                  speakBtn.prop('disabled', false);
                  speakBtn.html('<i class="fas fa-volume-up"></i>');
                  alert('音频播放失败');
              };
              
              await audio.play();
              
          } catch (error) {
              console.error('语音播放错误:', error);
              alert('语音播放失败，请重试');
              $(this).prop('disabled', false).html('<i class="fas fa-volume-up"></i>');
          }
        });

        // 添加复制功能
        $(document).on('click', '.copy-btn', function() {
          const copyBtn = $(this);

          // 检查是否存在 .message-content
          const messageContent = messageDiv.find('.message-content');

          } else {

              text = messageDiv.clone().children().remove().end().text().trim();

          navigator.clipboard.writeText(text).then(() => {

                        scrollToBottom();
                    }
                },
                error: function(xhr) {
                    // 显示错误信息
                    let errorMessage = '创建新对话失败';
                    try {
                        const response = JSON.parse(xhr.responseText);
                        errorMessage = response.error || errorMessage;
                    } catch (e) {}
                    
                    chatMessages.append(`
                        <div class="system-message error">
                            <i class="fas fa-exclamation-circle"></i> ${errorMessage}
                        </div>
                    `);
                    scrollToBottom();
                },
                complete: function() {
                    // 恢复按钮状态
                    newChatButton.prop('disabled', false);
                    newChatButton.html('<i class="fa-solid fa-plus"></i> 新对话');
                }
            });
        });

    });
  </script>
